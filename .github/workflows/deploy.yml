name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:
  # In-season refresh: Sunday 14:00 UTC (10am EDT, 9am EST) after the Saturday
  # slate, August through the January playoff. The refresh step below pulls
  # the week's games and poll onto the committed payload before the build.
  schedule:
    - cron: '0 14 * 1,8-12 0'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      # The bulk sources (cfbfastR schedules, jhowell.net, the AP polls) are
      # gitignored and cached between runs; fetch-data.mjs fills whatever the
      # cache lacks, the whole 1936-2026 archive when it is cold. A new entry
      # is saved every run so the week's files join it.
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-sources-${{ github.run_id }}
          restore-keys: raw-sources-
      # Refresh the in-progress season (schedule + AP poll) and rebuild the
      # ledger (CLAUDE.md's runbook). If a step fails, the committed payload
      # builds instead.
      - run: node scripts/refresh.mjs || git checkout -- data src/data
      # If the build dies with "Cannot find module '../lightningcss.linux-x64-gnu.node'"
      # (Tailwind v4, or anything else with a platform binary the macOS lockfile
      # skipped), install the Linux binary explicitly:
      # - run: npm install --no-save lightningcss-linux-x64-gnu
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
