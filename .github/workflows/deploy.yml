name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:
  # In-season refresh, August through the January playoff: Sunday 22:00 UTC,
  # after College Football Streak King's Sunday refresh publishes the week's
  # games (its 14:00 cron has run as late as 17:30), and Monday 13:00 in case
  # that one ran later still. The refresh step below pulls the week's games
  # and poll onto the committed payload before the build.
  schedule:
    - cron: '0 22 * 1,8-12 0'
    - cron: '0 13 * 1,8-12 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      # The bulk sources (cfbfastR schedules, jhowell.net, the AP polls) are
      # gitignored and cached between runs; fetch-data.mjs fills whatever the
      # cache lacks, the whole 1936-2026 archive when it is cold. A new entry
      # is saved every run so the week's files join it.
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-sources-${{ github.run_id }}
          restore-keys: raw-sources-
      # Refresh the in-progress season (schedule + AP poll) and rebuild the
      # ledger (CLAUDE.md's runbook). If a step fails, the committed payload
      # builds instead.
      - run: node scripts/refresh.mjs || git checkout -- data src/data
      # If the build dies with "Cannot find module '../lightningcss.linux-x64-gnu.node'"
      # (Tailwind v4, or anything else with a platform binary the macOS lockfile
      # skipped), install the Linux binary explicitly:
      # - run: npm install --no-save lightningcss-linux-x64-gnu
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Ask Bing and the other IndexNow engines to recrawl every page in the
  # sitemap once the deploy is live (scripts/indexnow.mjs). A failed ping
  # never fails the deploy (the script exits 0).
  indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/indexnow.mjs

  # The share worker (workers/share) bundles src/data and src/coach.js, so it
  # ships with the site. Needs a CLOUDFLARE_API_TOKEN repo secret, a token made
  # from the "Edit Cloudflare Workers" template
  # (gh secret set CLOUDFLARE_API_TOKEN --repo DrewHoo/hostile-territory);
  # without it the job skips and the worker stays as last deployed by hand
  # (npm run worker:deploy). The scheduled refresh commits no data, so it skips.
  worker:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name != 'schedule'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "no CLOUDFLARE_API_TOKEN secret; the worker stays as last deployed"
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.151.3' # the devDependency's version, so by-hand and CI deploys match
          command: deploy -c workers/share/wrangler.jsonc
